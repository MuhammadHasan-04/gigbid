name: eval
on:
  pull_request:
  workflow_dispatch:
jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    env:
      MODEL_PROFILE: heuristic          # deterministic; set to `open` with GROQ_API_KEY secret for a model run
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.12 .venv && uv pip install -e ".[dev]"
      - name: start GigSim
        run: |
          GIGSIM_RPM=100000 GIGSIM_ERROR_RATE=0 nohup .venv/bin/uvicorn gigsim.server:app --port 8081 > gigsim.log 2>&1 &
          for i in $(seq 1 20); do curl -fs localhost:8081/health && break; sleep 1; done
      - name: 30-job smoke eval with failure thresholds
        run: make smoke PY=.venv/bin/python
      - name: retrieval metrics (V0 vs best)
        run: MODEL_PROFILE=heuristic .venv/bin/python -m evals.runners.rag_eval --variants v0,best --limit 20 --tag ci
      - uses: actions/upload-artifact@v4
        with: { name: eval-results, path: evals/results }
