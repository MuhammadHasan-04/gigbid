name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: gigbid, POSTGRES_PASSWORD: gigbid, POSTGRES_DB: gigbid }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gigbid" --health-interval 5s --health-retries 20
    env:
      MODEL_PROFILE: heuristic
      DATABASE_URL: postgresql://gigbid:gigbid@localhost:5432/gigbid
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.12 .venv && uv pip install -e ".[dev]"
      - name: gigsim/ unchanged
        run: sha256sum -c gigsim.lock
      - name: no secrets, prompts only in agent/prompts
        run: .venv/bin/python -m pytest -q tests/unit/test_repo_rules.py
      - name: lint
        run: .venv/bin/ruff check agent rag mcp_servers apps/api worker evals gigsim tests
      - name: unit
        run: .venv/bin/python -m pytest -q tests/unit
      - name: contract (MCP schemas, annotations, idempotency)
        run: .venv/bin/python -m pytest -q tests/contract
      - name: integration (graphs against GigSim)
        run: .venv/bin/python -m pytest -q tests/integration
      - name: README numbers trace to evals/results
        run: .venv/bin/python scripts/check_readme_numbers.py

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: gigbid, POSTGRES_PASSWORD: gigbid, POSTGRES_DB: gigbid }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gigbid" --health-interval 5s --health-retries 20
    env:
      MODEL_PROFILE: heuristic
      RUN_INLINE: "1"
      DATABASE_URL: postgresql://gigbid:gigbid@localhost:5432/gigbid
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: uv venv -p 3.12 .venv && uv pip install -e ".[dev]"
      - run: cd apps/web && npm ci && npx tsc -b && npx vite build && npx playwright install --with-deps chromium
      - name: typed API contract is up to date
        run: .venv/bin/python -m apps.api.export_openapi /tmp/openapi.json && diff <(python -m json.tool apps/web/openapi.json) <(python -m json.tool /tmp/openapi.json)
      - name: start GigSim and API
        run: |
          GIGSIM_RPM=600 nohup .venv/bin/uvicorn gigsim.server:app --port 8081 > gigsim.log 2>&1 &
          nohup .venv/bin/uvicorn apps.api.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 2; done
      - run: cd apps/web && npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: apps/web/playwright-report }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.yml build
