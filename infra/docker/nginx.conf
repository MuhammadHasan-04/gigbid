server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;            # Server-Sent Events
    proxy_read_timeout 3600s;
  }
  location / { try_files $uri /index.html; }
}
