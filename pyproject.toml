[project]
name = "gigbid"
version = "1.0.0"
description = "GigBid: a multi-agent freelancer copilot (LangGraph, MCP, advanced RAG) with a human approving every send"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "langgraph==1.2.20",
  "langgraph-checkpoint-postgres==3.2.0",
  "langgraph-supervisor==0.0.31",
  "langchain-core==1.7.6",
  "langchain-openai==1.7.4",
  "langchain-mcp-adapters==0.3.2",
  "mcp==1.30.0",
  "fastapi==0.162.2",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
  "pydantic[email]==2.14.3",
  "pyyaml==6.0.3",
  "rank-bm25==0.2.2",
  "wordllama==0.4.0.post1",
  "numpy==2.5.4",
  "scikit-learn==1.9.1",
  "psycopg[binary,pool]==3.3.8",
  "psycopg-pool==3.3.3",
  "redis==5.3.1",
  "arq==0.28.0",
  "cryptography==50.0.2",
  "python-jose[cryptography]==3.5.0",
  "bcrypt==5.0.0",
  "pypdf==7.0.0",
  "reportlab==5.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "anyio==4.16.0", "ruff==0.8.4"]
data = ["kagglehub==1.0.3", "pandas==3.1.1", "openpyxl==3.1.5"]  # scripts/ingest_kaggle.py and evals/runners/real_data_eval.py only
rerank = ["sentence-transformers>=3.3"]
tracing = ["langfuse>=3.0"]

[project.scripts]
gigbid-portfolio-mcp = "mcp_servers.portfolio.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "rag*", "mcp_servers*", "gigsim*", "apps*", "worker*", "evals*"]

[tool.setuptools.package-data]
agent = ["prompts/*.md", "config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py311"
exclude = [".venv", "apps/web", "data", "gigsim"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E731", "I001", "E741", "E402"]
